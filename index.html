body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px)}

input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.top h1{font-size:18px;flex:1}
.back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.lang{font-weight:800;font-size:13px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff}
.logo{display:flex;align-items:center;gap:10px;flex:1}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--maize);display:grid;place-items:center;font-style:normal;font-size:17px}
.logo b{font:800 20px 'Sora'}
.hero{background:linear-gradient(160deg,#0B1226 0%,#16264D 60%,#1B3A8C 100%);color:#fff;padding:16px 0 74px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-80px;top:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(43,89,195,.55),transparent 70%)}
.hero .wrap{position:relative;display:grid;gap:14px;align-items:center}
.hero .row1{display:flex;align-items:center;gap:10px}
.hero h2{font-size:clamp(28px,7vw,46px);max-width:18ch;margin-top:16px}
.hero p{color:#B7C3DD;max-width:46ch;margin-top:12px}
.hero .tag{display:inline-flex;align-items:center;gap:8px;background:rgba(244,185,66,.15);color:var(--maize);font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:99px;margin-top:18px}
.scene{border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#27427C,#1B2E57);aspect-ratio:5/3;box-shadow:0 18px 40px rgba(0,0,0,.35)}

.quick{margin:-46px auto 0;position:relative;z-index:2}
.quick .box{background:var(--card);border-radius:var(--r);padding:16px 6px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 12px 30px rgba(11,18,38,.15)}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:4px}
.qa span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.qa:nth-child(1) span{background:var(--blue)}.qa:nth-child(2) span{background:#D98A0F}.qa:nth-child(3) span{background:#25A244}.qa:nth-child(4) span{background:#2B8FD6}

.steps{display:grid;gap:10px;margin:8px 0}

.step{background:var(--card);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.step em{font:800 17px 'Sora';font-style:normal;background:var(--maize);color:var(--navy);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.step b{display:block}.step small{color:var(--mute)}
.calc{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(11,18,38,.08);margin-top:8px}
.calc .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calc .head b{font:800 18px 'Sora'}
.calc input[type=range]{width:100%;accent-color:var(--blue);margin:14px 0 6px}
.calc .val{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mute);font-weight:700}
.calc .out{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}

.calc .out .st{padding:12px}
.calc .out .st b{font-size:18px}
.plans{display:grid;gap:16px}
@media(min-width:720px){.plans{grid-template-columns:1fr 1fr}}

.plan{background:var(--card);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;box-shadow:0 2px 0 var(--line)}
.ban{border-radius:13px;position:relative;overflow:hidden;aspect-ratio:5/3}
.ban svg.art{position:absolute;inset:0}
.ban .cap{position:absolute;left:12px;top:10px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}

.ban .cap b{font:800 24px 'Sora'}
.ban .badge{position:absolute;right:0;top:0;background:var(--maize);color:var(--navy);font-weight:800;font-size:12px;padding:6px 12px;border-radius:0 13px 0 13px}
.plan .desc{color:var(--mute);font-size:13.5px;margin:10px 2px 10px;min-height:38px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.g{background:#F4F6FA;border-radius:11px;padding:9px 11px}
.g small{display:block;color:var(--mute);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.g b{display:block;font:800 15px 'Sora';color:var(--navy);margin-top:2px}
.g.hl{background:var(--navy)}.g.hl small{color:#A9B7D6}.g.hl b{color:var(--maize)}

.inv{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.inv .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.bar{height:10px;background:#E7ECF5;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2B59C3,#1F9D63);border-radius:99px;transition:width .5s}
.inv .nums2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.inv .nums2 .st{background:#F4F6FA;text-align:center}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:13px;font-weight:800;background:var(--navy);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.maize{background:var(--maize);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.wa{background:#25A244}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.li{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:15px 16px;margin-bottom:10px;width:100%;text-align:left;font-weight:700}

.s-pending{background:#FFF1D1;color:#8F5E00}
.s-paid{background:#DCEBFA;color:#1D4F91}

.in{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:0}
.in:focus{border-color:var(--navy)}

.tip{font-size:13px;color:var(--mute);margin-top:6px}

.sum.t{font:800 19px 'Sora';border:0;padding-top:12px}
.spin{width:54px;height:54px;border:5px solid #DCE6F8;border-top-color:var(--blue);border-radius:50%;margin:6px auto 18px;animation:rot 1s linear infinite}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes rot{to{transform:rotate(360deg)}}

.auth .hd{padding:22px 0 20px}
.auth .box{background:#fff;color:var(--text);border-radius:24px 24px 0 0;padding:22px 18px 50px;min-height:62vh}
.link{color:var(--blue);font-weight:800}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in2{max-width:1080px;margin:0 auto;display:grid;height:var(--nav);align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute);position:relative}
.nav button span{width:54px;height:34px;border-radius:99px;display:grid;place-items:center}
.nav button.on{color:var(--navy)}.nav button.on span{background:var(--maize)}
.dot{position:absolute;top:-2px;right:calc(50% - 30px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:90;font-weight:700;font-size:14px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.err{background:var(--bad)}
details{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
summary{font-weight:800;cursor:pointer}details p{margin-top:8px;color:var(--mute)}
.note{background:#EAF3FF;border-left:4px solid var(--blue);padding:12px 14px;border-radius:10px;font-size:13.5px;color:#233;margin-top:12px}
.warn{background:#FFF4E5;border-left:4px solid #D9822B;padding:12px 14px;border-radius:10px;font-size:13.5px;color:#5A3A00;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

============================================================ */
function invStats(o){
  const p = planById(o.planId); if (!p) return { day:0, days:0, earned:0, remaining:0, total:0, pct:0, done:false, ends:null };
  const start = o.paidAt || o.createdAt;
  const msDay = 86400000;
  const elapsed = Math.floor((Date.now() - start) / msDay);
  const dayNow = Math.min(p.days, Math.max(1, elapsed + 1));
  const earned = Math.min(p.days, dayNow) * p.daily;
  const total = totalOf(p);
  const remaining = Math.max(0, total - earned);
  const pct = Math.round(earned / total * 100);
  const ends = start + p.days * msDay;
  return { day:dayNow, days:p.days, earned, remaining, total, pct, done:dayNow >= p.days, ends };
}/* ============================================================

============================================================ */
async function loadOrdersFromServer(){
  if (!S.user) { S.orders = []; return; }
  try {
    const r = await fetch('/api/orders/' + S.user.uid);
    const data = await r.json();
    S.orders = (data || []).map(o => ({
      ...o,
      planId: o.plan_id, planName: o.plan_name,
      createdAt: new Date(o.created_at).getTime(),
      paidAt: o.paid_at ? new Date(o.paid_at).getTime() : null
    }));
  } catch (e) { console.error(e); S.orders = []; }
}

                         : [['home','home','home'],['orders','orders','bot'],['help','help','help'],['me','me','user']];
  $('#nav').style.display = hide ? 'none' : '';
  $('#nav').innerHTML = `<div class="in2" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(([id, k, i]) => `<button data-act="nav" data-v="${id}" class="${guard === id ? 'on' : ''}"><span>${ico(i)}</span>${t(k)}</button>`).join('')}</div>`;
  document.documentElement.lang = S.lang;
  if (guard === 'home') bindSlider();
}
async function go(v){
  S.view = v; window.scrollTo(0, 0);
  if (['orders','me','home'].includes(v)) await loadOrdersFromServer();
  render();
}
function bindSlider(){
  const sl = $('#slider'); if (!sl) return;
  const upd = () => {
    const v = Number(sl.value);
    const p = CONFIG.PLANS.reduce((best, x) => Math.abs(x.price - v) < Math.abs(best.price - v) ? x : best);
    $('#sv').textContent = fmt(v);
    $('#sp').textContent = `${t('level')} ${p.id} · ${L(p.name)}`;
    const ratio = v / p.price;
    const daily = Math.round(p.daily * ratio);
    const tot = daily * p.days;
    const net = tot - v;
    const roi = Math.round(net / v * 100);
    $('#sd').textContent = fmt(daily);
    $('#stt').textContent = fmt(tot);
    $('#sn').textContent = '+' + fmt(net);
    $('#sr').textContent = roi + '%';
  };
  sl.addEventListener('input', upd); upd();
}/* ============================================================
   ACTIONS
============================================================ */
const ACT = {
  nav: d => go(d.v),
  go: d => go(d.v),
  back: () => go('home'),
  scroll: () => document.getElementById('levels')?.scrollIntoView({ behavior:'smooth' }),
  lang: () => { S.lang = S.lang === 'fr' ? 'en' : 'fr'; localStorage.setItem('aa_lang', S.lang); const y = window.scrollY; render(); window.scrollTo(0, y); },
  filter: d => { S.filter = d.f; render(); },
  buy: d => { if (!S.user) { S.after = Number(d.id); S.authMode = 'login'; S.view = 'auth'; return render(); } openPay(Number(d.id)); },
  authmode: () => { S.authMode = S.authMode === 'login' ? 'register' : 'login'; render(); },
  cancelauth: () => { S.after = null; go('home'); },

  auth: async () => {
    const val = id => ($('#' + id)?.value || '').trim();
    const phone = normPhone(val('a-phone')), pass = $('#a-pass').value;

    // Accès admin par code secret
    if (phone === CONFIG.ADMIN_CODE || val('a-phone') === CONFIG.ADMIN_CODE) {
      S.user = { uid:'admin', name:'Admin', phone:'', admin:true };
      saveCurrentUser(S.user);
      S.view = 'admin';
      S.orders = [];
      return render();
    }

    try {
      if (S.authMode === 'register') {
        if (!val('a-name')) return toast(t('e_name'), true);
        if (!validPhone(phone)) return toast(t('e_phone'), true);
        if (pass.length < 6) return toast(t('e_pass'), true);
        if (pass !== $('#a-pass2').value) return toast(t('e_match'), true);

        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: val('a-name'), phone, password: pass })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Erreur');

        S.user = { uid: data.user.id, name: data.user.name, phone: data.user.phone };
        saveCurrentUser(S.user);
      } else {
        if (!validPhone(phone)) return toast(t('e_phone'), true);

        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password: pass })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Erreur');

        S.user = { uid: data.user.id, name: data.user.name, phone: data.user.phone };
        saveCurrentUser(S.user);
      }

      await loadOrdersFromServer();
      if (S.after) { const id = S.after; S.after = null; S.view = 'home'; render(); return openPay(id); }
      S.view = 'home'; render();
    } catch (e) {
      console.error(e);
      toast(e.message || t('e_gen'), true);
    }
  },

  logout: () => {
    S.user = null;
    saveCurrentUser(null);
    S.view = 'home';
    S.orders = [];
    render();
  },

  setst: async d => {
    // Admin : mise à jour d'une commande via serveur (à connecter plus tard à Supabase)
    const o = S.orders.find(x => x.id === d.id);
    if (!o) return;
    o.status = d.s;
    if (d.s === 'paid') o.paidAt = Date.now();
    render();
    toast(t('ok_st'));
  },

  pay: async () => {
    const op = $('input[name=m]:checked')?.value || 'orange';
    const phone = normPhone($('#c-phone').value);
    if (!validPhone(phone)) return toast(t('e_phone'), true);

    const p = planById(S.planId);
    const btn = $('#c-go'); btn.disabled = true; btn.textContent = t('sending');

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: S.user.uid,
          plan_id: p.id,
          plan_name: L(p.name),
          total: p.price,
          method: op,
          phone: phone,
          reference: 'PENDING-' + Date.now()
        })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Erreur');

      await loadOrdersFromServer();
      closeSheet();
      showSuccessPayment(data.order);
    } catch (err) {
      console.error(err);
      toast(err.message || t('e_gen'), true);
      btn.disabled = false; btn.textContent = t('payBtn', fmt(p.price));
    }
  },

  payorder: d => { const o = S.orders.find(x => x.id === d.id); if (o) openPay(o.planId, o); },
  check: () => toast('Vérification en attente', true),
  close: () => closeSheet(),
  finish: () => { closeSheet(); go('orders'); }
};

/* ============================================================
   FEUILLES (MODALES)
============================================================ */
function closeSheet(){ $('#layer').innerHTML = ''; }

function openPay(planId, order = null){
  const p = planById(planId); S.planId = planId; S.cur = order;
  $('#layer').innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true">
    <h3>${t('checkoutT')}</h3>
    <div class="sum"><span>${t('level')} ${p.id} · ${esc(L(p.name))}</span><span>${p.days} ${t('days_unit')}</span></div>
    <div class="sum" style="border:0"><span>${t('daily')}</span><span>${fmt(p.daily)}</span></div>
    <div class="sum t" style="padding-top:0"><span>${t('price')}</span><span>${fmt(p.price)}</span></div>
    <label>${t('payWith')}</label>
    <div class="pay">
      <label><input type="radio" name="m" value="orange" checked><b style="color:#FF7900">●</b> Orange Money</label>
      <label><input type="radio" name="m" value="mtn"><b style="color:#E8B800">●</b> MTN MoMo</label>
    </div>
    <label for="c-phone">${t('phonePay')}</label>
    <input class="in" id="c-phone" inputmode="tel" placeholder="6XXXXXXXX" autocomplete="tel" value="${esc(S.user.phone || '')}">
    <div class="tip">${t('phonePayTip')}</div>
    <p class="tip" style="margin-top:12px">🔒 ${t('secure')}</p>
    <button class="btn maize" id="c-go" style="margin-top:14px" data-act="pay">${t('payBtn', fmt(p.price))}</button>
    <button class="btn ghost" style="margin-top:8px" data-act="close">${t('close')}</button>
  </div></div>`;
}

function showSuccessPayment(order){
  $('#layer').innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" style="text-align:center">
    <div style="font-size:54px">✅</div>
    <h3>${t('doneT')}</h3>
    <p style="color:var(--mute);margin:6px 0 14px">${t('doneD')}</p>
    <div class="st" style="margin-bottom:14px"><small>${t('code')}</small><b>#${code(order)}</b></div>
    <button class="btn maize" data-act="finish">${t('myOrders')}</button>
  </div></div>`;
}

/* ============================================================
   ÉVÉNEMENTS
============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('sheet-bg') && e.target !== el) return;
  ACT[el.dataset.act]?.(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') ACT.auth();
});

/* ============================================================
   DÉMARRAGE
============================================================ */
(async function boot(){
  restoreSession();
  if (S.user?.admin) S.view = 'admin';
  if (S.user && !S.user.admin) await loadOrdersFromServer();
  render();
})();
</script>
</body>
</html>
