/* Validation téléphone par pays */
function validatePhoneForCountry(phone, countryCode){
  const c = getCountry(countryCode);
  if (!c) return false;
  const digits = String(phone).replace(/\D/g, '');
  if (digits.length !== c.len) return false;
  if (c.prefix && !digits.startsWith(c.prefix)) return false;
  return true;
}

/* ============================================================
   ANTI-FRAUDE
============================================================ */
const SUSPECT_PATTERNS = [
  /(?:script|select|insert|update|delete|drop|union|exec)/i,
  /[<>{}\[\]\\]/,
  /(.)\1{5,}/
];
function isSuspect(v){
  if (!v) return false;
  const s = String(v).trim();
  if (s.length < 2 || s.length > 80) return true;
  for (const p of SUSPECT_PATTERNS) if (p.test(s)) return true;
  return false;
}
/* Mot de passe : min 5, au moins 1 lettre + 1 chiffre */
function validPassword(p){
  if (!p || p.length < 5) return false;
  if (!/[a-zA-Z]/.test(p)) return false;
  if (!/\d/.test(p)) return false;
  return true;
}
function validateAntiFraud({ name, phone, pass, country, city, countryFormat }){
  const errors = [];
  if (!name || isSuspect(name)) errors.push('name');
  if (!country) errors.push('country');
  if (!city) errors.push('city');
  if (country && !validatePhoneForCountry(phone, country)) errors.push('phone');
  if (!validPassword(pass)) errors.push('pass');
  return { ok: errors.length === 0, errors };
}

/* ============================================================
   CALCULS INVESTISSEMENT
============================================================ */
function invStats(o){
  const p = planById(o.planId);
  if (!p) return { day:0, days:0, earned:0, remaining:0, total:0, pct:0, done:false, ends:null };
  const start = o.paidAt || o.createdAt;
  const elapsed = Math.floor((Date.now() - start) / 86400000);
  const dayNow = Math.min(p.days, Math.max(1, elapsed + 1));
  const earned = Math.min(p.days, dayNow) * p.daily;
  const total = totalOf(p);
  const remaining = Math.max(0, total - earned);
  const pct = Math.round(earned / total * 100);
  const ends = start + p.days * 86400000;
  return { day:dayNow, days:p.days, earned, remaining, total, pct, done:dayNow >= p.days, ends };
}

/* ============================================================
   SLIDER
============================================================ */
function bindSlider(){
  const sl = $('#slider');
  if (!sl) return;
  const upd = () => {
    const v = Number(sl.value);
    const p = CONFIG.PLANS.reduce((best, x) =>
      Math.abs(x.price - v) < Math.abs(best.price - v) ? x : best
    );
    $('#sv').textContent = fmt(v);
    $('#sp').textContent = `${t('level')} ${p.id} · ${L(p.name)}`;
    const ratio = v / p.price;
    const daily = Math.round(p.daily * ratio);
    const tot = daily * p.days;
    const net = tot - v;
    const roi = Math.round(net / v * 100);
    $('#sd').textContent = fmt(daily);
    $('#stt').textContent = fmt(tot);
    $('#sn').textContent = '+' + fmt(net);
    $('#sr').textContent = roi + '%';
  };
  sl.addEventListener('input', upd);
  upd();
}

async function go(v){
  if (v === 'login') { S.authMode = 'login'; v = 'auth'; }
  if (v === 'register') { S.authMode = 'register'; v = 'auth'; }

  S.view = v;
  S.menuOpen = false;
  window.scrollTo(0, 0);

  if (['orders','me','home'].includes(v)) await loadOrdersFromServer();
  if (v === 'admin' || S.user?.admin) await loadOrdersFromServer();

  render();
}/* ============================================================
   COMPTE À REBOURS (5 secondes)
============================================================ */
function startSecurityCountdown(callback, seconds = 5){
  let remaining = seconds;
  const renderCountdown = () => {
    $('#layer').innerHTML = `<div class="sheet-bg">
      <div class="sheet" role="dialog" aria-modal="true" style="text-align:center">
        <div style="font-size:44px;margin-bottom:8px">🔒</div>
        <h3>${t('countdownTitle')}</h3>
        <p style="color:var(--mute);margin:6px 0 10px;font-size:14px">${t('countdownText')}</p>
        <div class="countdown">
          <div class="num">${remaining}</div>
          <p>${t('countdownSec')}</p>
        </div>
        <div class="bar" style="margin-top:14px"><i style="width:${((seconds - remaining) / seconds * 100)}%"></i></div>
      </div>
    </div>`;
  };
  renderCountdown();

  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(interval);
      callback();
    } else {
      renderCountdown();
    }
  }, 1000);
}

/* ============================================================
   ÉCRAN SUCCÈS
============================================================ */
function showSuccessPayment(order){
  $('#layer').innerHTML = `<div class="sheet-bg">
    <div class="sheet" role="dialog" aria-modal="true" style="text-align:center">
      <div style="font-size:54px">✅</div>
      <h3>${t('doneT')}</h3>
      <p style="color:var(--mute);margin:6px 0 14px">${t('doneD')}</p>
      <div class="st" style="margin-bottom:14px">
        <small>${t('code')}</small>
        <b>#${code(order)}</b>
      </div>
      <a class="btn wa" href="${waLink(`Bonjour, ma commande #${code(order)} (${planLabel(order)}) est en attente. Référence: ${order.reference || ''}`)}" target="_blank" rel="noopener">
        ${ico('chat')} WhatsApp
      </a>
      <button class="btn ghost" style="margin-top:8px" data-act="finish">${t('myOrders')}</button>
    </div>
  </div>`;
}

function closeSheet(){ $('#layer').innerHTML = ''; }

/* ============================================================
   ACTIONS
============================================================ */
const ACT = {
  go: d => go(d.v),
  back: () => { S.menuOpen = false; go('home'); },
  scroll: () => document.getElementById('levels')?.scrollIntoView({ behavior:'smooth' }),
  toggleMenu: () => { S.menuOpen = !S.menuOpen; renderTopNav(); },

  goLogin: () => { S.authMode = 'login'; go('auth'); },
  goRegister: () => { S.authMode = 'register'; go('auth'); },

  lang: () => {
    S.lang = S.lang === 'fr' ? 'en' : 'fr';
    localStorage.setItem('aa_lang', S.lang);
    render();
  },

  /* ============ Copier dans le presse-papier ============ */
  copy: (d) => {
    const txt = d.txt || '';
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => toast(t('copied'))).catch(() => fallbackCopy(txt));
    } else {
      fallbackCopy(txt);
    }
  },

  authmode: () => {
    S.authMode = S.authMode === 'login' ? 'register' : 'login';
    S.selectedCountry = '';
    S.selectedCity = '';
    S.loginCountry = '';
    render();
  },

  cancelauth: () => { S.after = null; go('home'); },

  /* ============ INSCRIPTION / CONNEXION ============ */
  auth: async () => {
    const val = id => ($('#' + id)?.value || '').trim();
    const phone = val('a-phone').replace(/\D/g, '');
    const pass = $('#a-pass').value;

    // Admin par code secret
    if (phone === CONFIG.ADMIN_CODE || val('a-phone') === CONFIG.ADMIN_CODE) {
      S.user = { uid:'admin', name:'Admin', phone:'', admin:true };
      saveCurrentUser(S.user);
      S.view = 'admin';
      S.orders = [];
      render();
      return;
    }

    /* ======== INSCRIPTION ======== */
    if (S.authMode === 'register') {
      const name = val('a-name');
      const pass2 = $('#a-pass2').value;
      const country = $('#a-country')?.value || '';
      const city = $('#a-city')?.value || '';

      if (!name) return toast(t('e_name'), true);
      if (isSuspect(name)) return toast(t('e_suspect'), true);
      if (!country) return toast(t('e_country'), true);
      if (!city) return toast(t('e_city'), true);
      if (!validatePhoneForCountry(phone, country)) return toast(t('e_phone'), true);
      if (!validPassword(pass)) return toast(t('e_pass_format'), true);
      if (pass !== pass2) return toast(t('e_match'), true);

      const check = validateAntiFraud({ name, phone, pass, country, city });
      if (!check.ok) {
        console.warn('Anti-fraude bloqué:', check.errors);
        return toast(t('e_suspect'), true);
      }

      S.pendingUser = { name, phone, pass, country, city };
      showPrivacyPolicy(async () => { await ACT._doRegister(); });
      return;
    }

    /* ======== CONNEXION ======== */
    const lCountry = $('#a-country')?.value || '';
    if (!lCountry) return toast(t('e_country'), true);
    if (!validatePhoneForCountry(phone, lCountry)) return toast(t('e_phone'), true);
    if (!pass) return toast(t('e_fields'), true);

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password: pass })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || t('e_bad'));

      S.user = {
        uid: data.user.id,
        name: data.user.name,
        phone: data.user.phone,
        country: data.user.country || lCountry,
        city: data.user.city || ''
      };
      saveCurrentUser(S.user);

      await loadOrdersFromServer();

      if (S.after) {
        const id = S.after;
        S.after = null;
        S.view = 'home';
        render();
        return openPay(id);
      }
      go('home');
    } catch (e) {
      console.error(e);
      toast(e.message || t('e_bad'), true);
    }
  },

  _doRegister: async () => {
    if (!S.pendingUser) return;
    const { name, phone, pass, country, city } = S.pendingUser;

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, password: pass, country, city })
      });
      const data = await res.json();

      if (!data.success) {
        if (res.status === 409) throw new Error(t('e_used'));
        throw new Error(data.error || t('e_gen'));
      }

      S.user = {
        uid: data.user.id,
        name: data.user.name,
        phone: data.user.phone,
        country: data.user.country || country,
        city: data.user.city || city
      };
      saveCurrentUser(S.user);
      S.pendingUser = null;
      closeSheet();

      await loadOrdersFromServer();

      if (S.after) {
        const id = S.after;
        S.after = null;
        S.view = 'home';
        render();
        return openPay(id);
      }
      go('home');
      toast(S.lang === 'en' ? 'Welcome!' : 'Bienvenue !');
    } catch (e) {
      console.error(e);
      closeSheet();
      toast(e.message || t('e_gen'), true);
    }
  },

  acceptPrivacy: () => {
    if (typeof window.__privacyAcceptCallback === 'function') {
      const fn = window.__privacyAcceptCallback;
      window.__privacyAcceptCallback = null;
      fn();
    }
  },

  refusePrivacy: () => {
    S.pendingUser = null;
    window.__privacyAcceptCallback = null;
    closeSheet();
    S.authMode = 'login';
    go('home');
    toast(S.lang === 'en' ? 'You declined the privacy policy.' : 'Tu as refusé la politique.', true);
  },

  logout: () => {
    S.user = null;
    saveCurrentUser(null);
    S.view = 'home';
    S.orders = [];
    S.menuOpen = false;
    render();
  },

  setst: d => {
    const o = S.orders.find(x => x.id === d.id);
    if (!o) return;
    o.status = d.s;
    if (d.s === 'paid') o.paidAt = Date.now();
    render();
    toast(t('ok_st'));
  },

  buy: d => {
    if (!S.user) {
      S.after = Number(d.id);
      S.authMode = 'login';
      return go('auth');
    }
    openPay(Number(d.id));
  },

  /* ============ PAIEMENT OM ASSO ============ */
  pay: async () => {
    const ref = ($('#c-ref')?.value || '').trim();
    const phone = ($('#c-phone')?.value || '').replace(/\D/g, '');

    if (!ref || ref.length < 4) return toast(t('e_ref'), true);
    if (!validatePhoneForCountry(phone, S.user.country)) return toast(t('e_phone'), true);
    if (isSuspect(ref)) return toast(t('e_suspect'), true);

    const p = planById(S.planId);

    // Compte à rebours de sécurité de 5 secondes
    startSecurityCountdown(async () => {
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: S.user.uid,
            plan_id: p.id,
            plan_name: L(p.name),
            total: p.price,
            method: 'om_asso',
            phone: phone,
            reference: ref
          })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || t('e_gen'));

        await loadOrdersFromServer();
        closeSheet();
        showSuccessPayment(data.order);
      } catch (err) {
        console.error(err);
        closeSheet();
        toast(err.message || t('e_gen'), true);
      }
    }, 5);
  },

  close: () => closeSheet(),
  finish: () => { closeSheet(); go('orders'); },
  filter: d => { S.filter = d.f; render(); },
  check: () => toast('Vérification en attente', true)
};

/* ============================================================
   FALLBACK copie
============================================================ */
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast(t('copied')); }
  catch { toast('Copie échouée', true); }
  document.body.removeChild(ta);
}

/* ============================================================
   ÉVÉNEMENTS GLOBAUX
============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('sheet-bg') && e.target !== el) return;
  const fn = ACT[el.dataset.act];
  if (typeof fn === 'function') fn(el.dataset, el, e);
});

/* ============================================================
   CHANGEMENT DE PAYS (selects) — Fixe : le select reste ouvert
   Utilise 'change' plutôt que 'click' pour ne pas interférer
============================================================ */

/* ============================================================
   CLAVIER
============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeSheet();
    if (S.menuOpen) { S.menuOpen = false; renderTopNav(); }
  }
  if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') {
    ACT.auth();
  }
});/* ============================================================
   CORRECTION : Gestion du changement de pays SANS re-render
   (Évite que le select se referme au clic)
============================================================ */
// On retire l'ancien listener de changement en clonant... 
// Plus simple : on réécrit le comportement via une fonction dédiée
function onCountryChange(countryCode){
  if (S.authMode === 'register') {
    S.selectedCountry = countryCode;
    S.selectedCity = '';
  } else {
    S.loginCountry = countryCode;
  }

  const info = getCountry(countryCode);

  // 1) Met à jour l'indicatif affiché
  const dialEl = document.getElementById('dial-display');
  if (dialEl) {
    dialEl.textContent = info ? `${info.flag} ${info.dial}` : '🌍 +---';
  }

  // 2) Met à jour le placeholder du téléphone
  const phoneInput = document.getElementById('a-phone');
  if (phoneInput) {
    phoneInput.placeholder = info ? info.hint.replace('Ex: ', '') : '677123456';
    phoneInput.maxLength = info ? info.len + 3 : 15;
  }

  // 3) Met à jour la ville (uniquement à l'inscription)
  if (S.authMode === 'register') {
    const citySel = document.getElementById('a-city');
    if (citySel) {
      if (!countryCode) {
        citySel.innerHTML = `<option value="">${t('selectCountryFirst')}</option>`;
        citySel.disabled = true;
      } else {
        const cities = getCities(countryCode);
        if (cities.length) {
          citySel.innerHTML = `<option value="">${t('chooseCity')}</option>` +
            cities.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
        } else {
          citySel.innerHTML = `<option value="">${t('noCities')}</option>`;
        }
        citySel.disabled = false;
      }
    }
  }
}

// Nouveau listener 'change' qui n'entraîne PAS de re-render
// ⚠️ On supprime l'ancien en réinitialisant via un flag
window.__countryListenerAttached = false;

function attachCountryListener(){
  if (window.__countryListenerAttached) return;
  window.__countryListenerAttached = true;

  document.addEventListener('change', e => {
    if (e.target.id === 'a-country') {
      onCountryChange(e.target.value);
    }
    if (e.target.id === 'a-city') {
      S.selectedCity = e.target.value;
    }
    if (e.target.id === 'priv-accept') {
      const btn = $('#btn-accept');
      if (btn) btn.disabled = !e.target.checked;
    }
  });
}

/* ============================================================
   DÉMARRAGE
============================================================ */
(async function boot(){
  restoreSession();

  attachCountryListener();

  if (S.user?.admin) {
    S.view = 'admin';
  }

  if (S.user && !S.user.admin) {
    await loadOrdersFromServer();
  }

  render();
})();
</script>
